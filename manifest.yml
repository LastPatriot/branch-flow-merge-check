modules:
  bitbucket:mergeCheck:
    - key: git-branching-strategy-validator
      function: validateBranchFlow
      name: Git Branching Strategy Validator
      description: Blocks pull requests whose source and target branches break the team branching strategy.
      triggers:
        # Shows the result on the PR as soon as commits are pushed.
        - on-code-pushed
        # Re-checks at the merge button (also catches a PR whose target was changed later).
        - on-merge
    - key: sensitive-config-file-check
      function: validateConfigFiles
      name: Sensitive Config File Check
      description: Blocks pull requests that add or change .env, appsettings.json or Spring Boot base config files.
      triggers:
        - on-code-pushed
        - on-merge
  trigger:
    - key: auto-merge-on-approval
      function: autoMergeOnApproval
      # Fires when a reviewer approves, requests changes, or has their status cleared.
      events:
        - avi:bitbucket:updated:pullrequest-reviewer-status
      filter:
        # Don't react to events caused by the app itself.
        ignoreSelf: true
    - key: release-notes-on-merge
      function: generateReleaseNotes
      # Fires when a pull request is merged. No ignoreSelf: PRs merged by auto-merge need notes too.
      events:
        - avi:bitbucket:fulfilled:pullrequest
  function:
    - key: validateBranchFlow
      handler: index.validateBranchFlow
    - key: autoMergeOnApproval
      handler: index.autoMergeOnApproval
    - key: validateConfigFiles
      handler: index.validateConfigFiles
    - key: generateReleaseNotes
      handler: index.generateReleaseNotes
permissions:
  scopes:
    - read:pullrequest:bitbucket
    # Needed to merge pull requests (auto-merge) and post release-note comments.
    - write:pullrequest:bitbucket
    # Needed to read a pull request's changed files (diffstat) and commits.
    - read:repository:bitbucket
app:
  runtime:
    name: nodejs22.x
  # Filled in by `forge register`.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
